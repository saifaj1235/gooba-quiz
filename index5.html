    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .quiz {
            width: 600px;
            max-width: 95%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
        }

        #questionImage {
            width: 300px;
            max-width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        #wrongImage {
            display: none;
            width: 100%;
            max-width: 335px;
            height: auto;
            margin: 15px auto;
            border-radius: 10px;
        }

        #answers button {
            display: block;
            width: 80%;
            max-width: 500px;
            margin: 10px auto;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f5f5f5;
        }

        #answers button:hover {
            background-color: #ddd;
        }

        #next {
            background-color: black;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }

        #score {
            margin-top: 20px;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .quiz {
                width: 100%;
                margin: 10px auto;
                padding: 15px;
            }

            h1 {
                font-size: 28px;
            }

            #question {
                font-size: 20px;
            }

            #answers button {
                width: 95%;
                font-size: 16px;
            }

            #next {
                width: 95%;
            }
        }
    </style>
</head>

let currentQuestion = 0;
let score = 0;
let answered = false;


/* =========================
   AFFICHER LA QUESTION
========================= */

function showQuestion() {

    answered = false;

    // نخبيو تصويرة الإجابة الغالطة
    document.getElementById("wrongImage").style.display = "none";

    let q = questions[currentQuestion];

    document.getElementById("question").textContent = q.question;

    document.getElementById("questionImage").src = q.image;

    let answersDiv = document.getElementById("answers");

    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {

        let button = document.createElement("button");

        button.textContent = answer;

        button.onclick = function() {
            checkAnswer(index);
        };

        answersDiv.appendChild(button);
    });
}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(index) {

    // يمنع الإجابة أكثر من مرة
    if (answered === true) {
        return;
    }

    answered = true;

    let wrongImage = document.getElementById("wrongImage");

    if (index === questions[currentQuestion].correct) {

        // إجابة صحيحة
        score++;

        wrongImage.style.display = "none";

        alert("Bonne réponse !");

    } else {

        // إجابة غالطة
        wrongImage.style.display = "block";

        alert("Mauvaise réponse !");

    }

    document.getElementById("score").textContent =
        "Score : " + score;
}


/* =========================
   QUESTION SUIVANTE
========================= */
function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

            style="

    `;
}
        }
    }

function showQuestion() {
    answered = false;

    document.getElementById("wrongImage").style.display = "none";
    document.getElementById("correctImage").style.display = "none";

    let q = questions[currentQuestion];

    document.getElementById("question").textContent = q.question;
    document.getElementById("questionImage").src = q.image;

    let answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        let button = document.createElement("button");

        button.textContent = answer;

        button.onclick = function() {
            checkAnswer(index);
        };

        answersDiv.appendChild(button);
    });
}

function checkAnswer(index) {

    if (answered === true) {
        return;
    }

    answered = true;

    let wrongImage = document.getElementById("wrongImage");
    let correctImage = document.getElementById("correctImage");

    wrongImage.style.display = "none";
    correctImage.style.display = "none";

    if (index === questions[currentQuestion].correct) {

        score++;

        correctImage.style.display = "block";

        alert("Bonne réponse !");

    } else {

        wrongImage.style.display = "block";

        alert("Mauvaise réponse !");
    }

    document.getElementById("score").textContent =
        "Score : " + score;
}
